<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <title>Прокачай тусовку — прототип</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main id="app">
      <canvas id="game-canvas" aria-label="Игровая сцена"></canvas>
      <section class="hud" aria-live="polite">
        <div class="brand"><span>⚡</span><div><b>ПРОКАЧАЙ ТУСОВКУ</b><small id="trend-label">Тренд: Неоновая ночь</small></div></div>
        <div class="money">💸 <span id="money">0</span><small>монет</small></div>
      </section>
      <section class="hint" id="hint">WASD — движение · E — взаимодействовать</section>
      <section id="shop" class="shop" aria-label="Улучшения"></section>
      <button id="interact" class="interact" type="button" hidden>Взаимодействовать</button>
      <div id="mobile-controls" class="mobile-controls" hidden>
        <div id="joystick" class="joystick"><i id="stick"></i></div>
        <div class="look-note">Двигайся стиком</div>
      </div>
      <div id="toast" class="toast" role="status"></div>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
